<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#c7c5be"/>
  <meta name="description" content="Mimmi’s books displayed as a tactile e-ink reader library."/>
  <title>Mimmi’s Kindle Library</title>
  <link rel="stylesheet" href="styles.css?v=20260906-kindle-2"/>
  <script src="script.js?v=20260906-kindle-2" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="bookTitle">
      <div
        id="heroKindle"
        class="kindle"
        role="button"
        tabindex="0"
        aria-pressed="false"
        aria-label="Flip the reader to reveal the engraved cover"
      >
        <div class="kindle-inner">
          <article class="kindle-face kindle-front">
            <div class="eink-screen" aria-live="polite">
              <header class="screen-status">
                <span>MIMMI READER</span>
                <span id="screenProgress">LIBRARY</span>
              </header>

              <div class="screen-content">
                <p id="bookStatus" class="screen-kicker">Opening library</p>
                <h1 id="bookTitle">Loading…</h1>
                <p class="screen-author">by <span id="bookAuthor">—</span></p>

                <dl class="screen-details">
                  <div>
                    <dt>Published</dt>
                    <dd id="bookReleased">—</dd>
                  </div>
                  <div>
                    <dt>Read</dt>
                    <dd id="bookRead">—</dd>
                  </div>
                  <div>
                    <dt>Rating</dt>
                    <dd id="bookRating">—</dd>
                  </div>
                </dl>

                <blockquote id="bookNote" class="screen-note">Preparing your next read.</blockquote>
              </div>

              <footer class="screen-footer">
                <span>BOOK DETAILS</span>
                <span>PRESS TO FLIP</span>
              </footer>
            </div>
            <span class="device-mark" aria-hidden="true">mimmi</span>
          </article>

          <article class="kindle-face kindle-back" aria-label="Engraved book cover">
            <span class="back-seam" aria-hidden="true"></span>
            <div class="cover-engraving" aria-hidden="true">
              <canvas id="engravedCover" class="engraved-cover" width="280" height="400"></canvas>
              <img id="heroCover" class="engraving-source" alt=""/>
              <span id="coverFallback" class="cover-fallback"></span>
            </div>
            <p id="backTitle" class="back-title">Loading…</p>
            <p id="backAuthor" class="back-author">—</p>
            <span class="back-mark" aria-hidden="true">mimmi</span>
          </article>
        </div>
      </div>

      <p id="flipHint" class="flip-hint">Press the reader to see the engraved cover</p>
      <a class="scroll-cue" href="#library">All books <span aria-hidden="true">↓</span></a>
    </section>

    <section id="library" class="library" aria-labelledby="libraryTitle">
      <header class="library-header">
        <p>Your library</p>
        <h2 id="libraryTitle">Choose a Kindle</h2>
        <div class="library-toolbar">
          <div class="library-toggle" role="group" aria-label="Choose library status">
            <button class="filter-button" type="button" data-view="reading" aria-pressed="false">Currently reading</button>
            <button class="filter-button" type="button" data-view="read" aria-pressed="true">Already read</button>
          </div>
          <span id="libraryCount" class="library-count">— books</span>
        </div>
      </header>
      <div id="libraryGrid" class="library-grid" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

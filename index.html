<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#d7d1f0"/>
  <meta name="description" content="Mimmi's color-shifting pixel reading shelf."/>
  <title>Mimmi’s Shelf</title>
  <link rel="stylesheet" href="styles.css?v=20260906a"/>
  <script src="script.js?v=20260906b" defer></script>
</head>
<body>
  <div class="wrapper">
    <header class="top-bar">
      <a href="index.html" class="site-title" aria-label="Mimmi's Shelf home">mimmi’s shelf</a>

      <div class="control-panel" aria-label="Shelf controls">
        <label class="search-field" for="searchInput">
          <span class="search-label">Find a book</span>
          <input id="searchInput" class="search-input" type="search" placeholder="Title or author" autocomplete="off"/>
        </label>

        <div class="filter-box">
          <label class="toggle" title="Switch between current books and the full shelf">
            <input type="checkbox" id="filterToggle"/>
            <span class="slider" aria-hidden="true"></span>
            <span class="sr-only">Show all books</span>
          </label>
          <span id="filterLabel" class="filter-label">Currently Reading</span>
        </div>
      </div>
    </header>

    <main>
      <section id="showcase" class="showcase" aria-labelledby="title">
        <div class="book-zone">
          <p class="pixel-label">On the desk</p>
          <button id="bookLink" class="book-display" type="button" aria-label="Open current book page">
            <span id="bookObject" class="book-object" aria-hidden="true">
              <canvas id="pixelCover" class="pixel-cover" width="12" height="18"></canvas>
            </span>
            <img id="cover" class="cover-source" alt=""/>
          </button>
        </div>

        <article id="back" class="book-back">
          <p class="pixel-label">Selected book</p>
          <h1 id="title"></h1>
          <p class="byline">by <span id="author"></span></p>

          <ul class="book-facts">
            <li><strong>Released</strong><span id="released"></span></li>
            <li><strong>Read</strong><span id="read"></span></li>
            <li class="rating-line">
              <strong>Rating</strong>
              <span id="stars" class="stars" aria-label="Star rating"></span>
            </li>
          </ul>

          <div class="comment-block">
            <p class="label">Notes</p>
            <p id="aiComment" class="note-text"></p>
          </div>

          <p class="open-hint">Click the cover to open the book page ↗</p>
        </article>
      </section>

      <div class="pixel-divider" aria-hidden="true"></div>

      <section class="shelf-section" aria-labelledby="shelfTitle">
        <div class="shelf-heading">
          <h2 id="shelfTitle">The shelf</h2>
          <p><span id="shelfCount">—</span> books</p>
        </div>
        <section id="grid" class="grid" aria-live="polite"></section>
      </section>
    </main>
  </div>
</body>
</html>
